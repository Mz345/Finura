<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Finura</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/pages/login.css" />
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-logo">
        <div class="icon-bg">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
            <path d="M18 17V9"></path>
            <path d="M13 17V5"></path>
            <path d="M8 17v-3"></path>
          </svg>
        </div>
        <h1>Finura</h1>
      </div>
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-card-header">
        <h3>Sign In</h3>
        <p>Enter your email and password to access your account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required class="form-input" />
        </div>

        <div class="form-group password-wrapper">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required class="form-input" />
          <button type="button" id="toggle-password">
          </button>
        </div>

        <div class="links-group">
          <a href="#" class="link">Forgot password?</a>
        </div>

        <div class="form-group">
          <button type="submit" class="submit-btn">Sign In</button>
        </div>
      </form>

      <p class="footer-link">
        Don't have an account? <a href="/signup" class="link">Sign up</a>
      </p>
    </div>
  </div>

  <script type="module" src="/src/js/pages/login.js"></script>
</body>
</html>
